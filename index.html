<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Profile card component</title>
  </head>
  <body>
    <main class="profile-card">
      <div class="header">
        <img
          class="profile-image"
          src="images/image-victor.jpg"
          alt="A profile picture of Victor Crest"
        />
        <div class="profile-person">
          <p class="profile-name">Victor Crest</p>
          <p class="profile-age">26</p>
        </div>

        <p class="profile-address">London</p>
      </div>

      <div class="profile-info">
        <div><span>80k</span><span>Followers</span></div>
        <div><span>803k</span><span>Likes</span></div>
        <div><span>1.4k</span><span>Photos</span></div>
      </div>
    </main>
  </body>
</html>
