<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Profile card component</title>
  </head>
  <body>
    <main class="profile-card">
      <div class="header">
        <img
          class="profile-image"
          src="images/image-victor.jpg"
          alt="A profile picture of Victor Crest"
        />
        <div class="profile-person">
          <div class="profile-name-age">
            <h2 class="profile-name">Victor Crest</h2>
            <p class="profile-age">26</p>
          </div>
          <p class="profile-address">London</p>
        </div>
      </div>

      <div class="profile-infos">
        <div class="profile-info">
          <span class="profile-info__number">80k</span
          ><span class="profile-info__text">Followers</span>
        </div>
        <div class="profile-info">
          <span class="profile-info__number">803k</span
          ><span class="profile-info__text">Likes</span>
        </div>
        <div class="profile-info">
          <span class="profile-info__number">1.4k</span
          ><span class="profile-info__text">Photos</span>
        </div>
      </div>
    </main>
  </body>
</html>
