<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Profile card component</title>
  </head>
  <body>
    <main class="profile-card">
      <img
        class="profile-image"
        src="images/image-victor.jpg"
        alt="A profile picture of Victor Crest"
      />
      <div class="profile-person">
        <p class="profile-name">Victor Crest</p>
        <p class="profile-age">26</p>
      </div>

      <p class="profile-address">London</p>

      <div class="profile-info">
        <div><span>80k</span><span>Followers</span></div>
        <div><span>803k</span><span>Likes</span></div>
        <div><span>1.4k</span><span>Photos</span></div>
      </div>
    </main>
  </body>
</html>
